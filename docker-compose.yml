services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: bodify-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: bodify
      POSTGRES_USER: bodify
      POSTGRES_PASSWORD: 12345678

    ports:
      - "5432:5432"

    volumes:
      - bodify_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodify -d bodify"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - bodify-network


  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: bodify-minio

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: bodify
      MINIO_ROOT_PASSWORD: 12345678

    command: server /data --console-address ":9001"

    ports:
      # S3 API
      - "9000:9000"

      # MinIO Web Console
      - "9001:9001"

    volumes:
      - bodify_minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - bodify-network


# ==============================================================
# Persistent volumes
# ==============================================================
volumes:

  bodify_postgres_data:
    name: bodify_postgres_data

  bodify_minio_data:
    name: bodify_minio_data


# ==============================================================
# Network
# ==============================================================
networks:

  bodify-network:
    name: bodify-network
    driver: bridge